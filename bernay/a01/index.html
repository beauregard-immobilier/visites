/* Jetons de couleur : valeurs claires, puis sombres (préférence système ou choix explicite). */
:root {
  --fond: #ece7dd;
  --texte: #2b2620;
  --texte-doux: #5f574c;
  --panneau: rgba(250, 247, 240, 0.82);
  --bord: rgba(43, 38, 32, 0.22);
  --accent: #7a5a2e;
  --accent-texte: #fffaf0;
  --focus: #1d4f91;
  --plan-fond: rgba(250, 247, 240, 0.9);
  --plan-contour: #2b2620;
  --plan-fin: rgba(43, 38, 32, 0.55);
  --plan-baie: #3f7fb5;
  --plan-porte: #a28a62;
  --plan-meuble: rgba(43, 38, 32, 0.14);
  --plan-nom: rgba(43, 38, 32, 0.7);
  --plan-point: #b3261e;
  --plan-pv: #7a5a2e;
  --plan-cone: rgba(179, 38, 30, 0.28);
  /* plan d'architecte et verre sombre des commandes posées sur l'image (charte de la brochure : encre, brique, crème) */
  --plan-papier: #fbf8f1; --plan-encre: #1f2b3d; --plan-piece: #fbf8f1; --plan-ici: #f3e9da;
  --plan-trait: rgba(31, 43, 61, 0.6); --plan-trait-fin: rgba(31, 43, 61, 0.45); --plan-remplissage: rgba(31, 43, 61, 0.045);
  --plan-vitrage: #7c9db8; --plan-bois: #9b6a3c; --plan-accent: #8a3b2c; --plan-halo: rgba(138, 59, 44, 0.16);
  --plan-texte: #1f2b3d; --plan-doux: #6b6f76; --plan-filet: rgba(31, 43, 61, 0.12); --plan-filet-fort: rgba(31, 43, 61, 0.24);
  --plan-ombre: rgba(10, 12, 16, 0.34);
  --verre: rgba(22, 28, 38, 0.6); --verre-fort: rgba(22, 28, 38, 0.8); --sur-image: #f7f2e8;
  --voile: rgba(236, 231, 221, 0.94);
  --barre-fond: rgba(43, 38, 32, 0.15);
  --erreur: #8c1d18;
  --repere-fond: rgba(24, 20, 15, 0.66);
  --repere-texte: #fffaf0;
  --repere-trait: #ffffff;
  --carte: #fbf8f1;
  --carte-ombre: rgba(24, 17, 8, 0.34);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #1d1a16;
    --texte: #efe9dd;
    --texte-doux: #b9b0a0;
    --panneau: rgba(34, 30, 25, 0.8);
    --bord: rgba(239, 233, 221, 0.25);
    --accent: #d2ad73;
    --accent-texte: #1d1a16;
    --focus: #8fb8ee;
    --plan-fond: rgba(34, 30, 25, 0.88);
    --plan-contour: #efe9dd;
    --plan-fin: rgba(239, 233, 221, 0.55);
    --plan-baie: #7fb4e0;
    --plan-porte: #c4aa7c;
    --plan-meuble: rgba(239, 233, 221, 0.18);
    --plan-nom: rgba(239, 233, 221, 0.75);
    --plan-point: #ff7d73;
    --plan-pv: #d2ad73;
    --plan-cone: rgba(255, 125, 115, 0.3);
    --plan-papier: #1b2029; --plan-encre: #d8d0c2; --plan-piece: #1b2029; --plan-ici: #30303a;
    --plan-trait: rgba(241, 235, 224, 0.6); --plan-trait-fin: rgba(241, 235, 224, 0.42); --plan-remplissage: rgba(241, 235, 224, 0.06);
    --plan-vitrage: #8fb4d2; --plan-bois: #c9966a; --plan-accent: #e08b74; --plan-halo: rgba(224, 139, 116, 0.22);
    --plan-texte: #efe9dd; --plan-doux: #b9b0a0; --plan-filet: rgba(241, 235, 224, 0.14); --plan-filet-fort: rgba(241, 235, 224, 0.3);
    --plan-ombre: rgba(0, 0, 0, 0.6);
    --voile: rgba(29, 26, 22, 0.94);
    --barre-fond: rgba(239, 233, 221, 0.2);
    --erreur: #ff9d95;
    --repere-fond: rgba(24, 20, 15, 0.7);
    --carte: #2a251e;
    --carte-ombre: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #1d1a16;
  --texte: #efe9dd;
  --texte-doux: #b9b0a0;
  --panneau: rgba(34, 30, 25, 0.8);
  --bord: rgba(239, 233, 221, 0.25);
  --accent: #d2ad73;
  --accent-texte: #1d1a16;
  --focus: #8fb8ee;
  --plan-fond: rgba(34, 30, 25, 0.88);
  --plan-contour: #efe9dd;
  --plan-fin: rgba(239, 233, 221, 0.55);
  --plan-baie: #7fb4e0;
  --plan-porte: #c4aa7c;
  --plan-meuble: rgba(239, 233, 221, 0.18);
  --plan-nom: rgba(239, 233, 221, 0.75);
  --plan-point: #ff7d73;
  --plan-pv: #d2ad73;
  --plan-cone: rgba(255, 125, 115, 0.3);
  --plan-papier: #1b2029; --plan-encre: #d8d0c2; --plan-piece: #1b2029; --plan-ici: #30303a;
  --plan-trait: rgba(241, 235, 224, 0.6); --plan-trait-fin: rgba(241, 235, 224, 0.42); --plan-remplissage: rgba(241, 235, 224, 0.06);
  --plan-vitrage: #8fb4d2; --plan-bois: #c9966a; --plan-accent: #e08b74; --plan-halo: rgba(224, 139, 116, 0.22);
  --plan-texte: #efe9dd; --plan-doux: #b9b0a0; --plan-filet: rgba(241, 235, 224, 0.14); --plan-filet-fort: rgba(241, 235, 224, 0.3);
  --plan-ombre: rgba(0, 0, 0, 0.6);

}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--texte);
  font-family: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px;
  overflow: hidden;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#vue {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: grab;
}
#vue.glisse { cursor: grabbing; }

.panneau {
  background: var(--panneau);
  border: 1px solid var(--bord);
  border-radius: 2px;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
button { font: inherit; color: var(--texte); }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Voiles en haut et en bas de l'image : le titre et la barre des pièces s'y lisent sans cartouche */
.voile { position: absolute; left: 0; right: 0; pointer-events: none; }
.voile.haut { top: 0; height: 150px; background: linear-gradient(rgba(18, 22, 30, 0.5), rgba(18, 22, 30, 0)); }
.voile.bas { bottom: 0; height: 230px; background: linear-gradient(rgba(18, 22, 30, 0), rgba(18, 22, 30, 0.58)); }

/* Plan du lot : carte en haut à gauche, agrandie au centre d'un clic, repliée en pastille */
#plan {
  position: absolute;
  top: max(16px, env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box; width: 300px; max-width: calc(100% - 32px); z-index: 3;
  background: var(--plan-papier); color: var(--plan-texte); border-radius: 9px; overflow: hidden;
  box-shadow: 0 16px 40px var(--plan-ombre), 0 0 0 1px var(--plan-filet);
  font-family: 'Jost', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
#plan[data-etat="ferme"] { display: none; }
#plan[data-etat="grand"] {
  top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 6; max-width: none;
  width: min(980px, calc(100% - 48px), calc((100vh - 150px) * 1.45));
}
#plan-tete {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 10px 8px 13px; border-bottom: 1px solid var(--plan-filet);
}
#plan-tete .l {
  font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
#plan-tete .l em {
  font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: 15px;
  letter-spacing: 0.02em; text-transform: none; color: var(--plan-accent); margin-left: 7px;
}
#plan-tete .o { display: flex; gap: 5px; flex: none; }
#plan-tete button {
  width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 1px solid var(--plan-filet-fort);
  background: transparent; color: var(--plan-texte); display: grid; place-items: center; cursor: pointer;
}
#plan-tete button:hover { border-color: var(--plan-accent); color: var(--plan-accent); }
#plan-tete svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#plan-corps { padding: 7px 8px 8px; }
#plan[data-etat="grand"] #plan-corps { padding: 14px 18px 18px; }
#plan-svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
#plan-svg .masse { fill: var(--plan-encre); }
#plan-svg .masse-trait { fill: var(--plan-encre); stroke: var(--plan-encre); stroke-linejoin: miter; }
#plan-svg .piece { fill: var(--plan-piece); stroke: var(--plan-encre); stroke-width: 0.035; stroke-linejoin: miter; }
#plan-svg .piece.ici { fill: var(--plan-ici); }
#plan-svg .percement { fill: var(--plan-piece); }
#plan-svg .ebrasement, #plan-svg .chassis, #plan-svg .appui { stroke: var(--plan-encre); stroke-width: 0.03; }
#plan-svg .vitrage { stroke: var(--plan-vitrage); stroke-width: 0.05; }
#plan-svg .vantail { stroke: var(--plan-bois); stroke-width: 0.085; }
#plan-svg .paumelle { fill: var(--plan-encre); }
#plan-svg .placard { stroke: var(--plan-encre); stroke-width: 0.03; stroke-dasharray: 0.09 0.06; }
#plan-svg .meuble { fill: var(--plan-remplissage); stroke: var(--plan-trait); stroke-width: 0.028; }
#plan-svg .chaise { fill: var(--plan-piece); stroke: var(--plan-trait-fin); stroke-width: 0.024; }
#plan-svg .detail { fill: none; stroke: var(--plan-trait-fin); stroke-width: 0.024; }
#plan-svg .plein { stroke: var(--plan-encre); stroke-width: 0.03; }
#plan-svg .plein-fin { fill: var(--plan-encre); }
#plan-svg .hach { stroke: var(--plan-encre); stroke-width: 0.022; opacity: 0.55; }
#plan-svg .cone-a { stop-color: var(--plan-accent); stop-opacity: 0.55; }
#plan-svg .cone-b { stop-color: var(--plan-accent); stop-opacity: 0; }
#plan-svg text { display: none; pointer-events: none; }          /* noms et surfaces : dans le plan agrandi seulement */
#plan[data-etat="grand"] #plan-svg text { display: block; }
#plan-svg .nom { fill: var(--plan-texte); text-anchor: middle; font-family: 'Jost', 'Source Sans 3', sans-serif; font-weight: 500; letter-spacing: 0.012em; }
#plan-svg .surface { fill: var(--plan-accent); text-anchor: middle; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; }
#plan-svg .dehors { fill: var(--plan-doux); text-anchor: middle; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }
#plan-svg .pv { fill: var(--plan-piece); stroke: var(--plan-accent); stroke-width: 0.06; }
#plan-svg .pv.actuel { opacity: 0; }
#plan-svg .pvzone { fill: transparent; cursor: pointer; }
#plan-svg .pvzone:hover { fill: var(--plan-halo); }
#plan-svg .ici-halo { fill: var(--plan-halo); pointer-events: none; }
#plan-svg .ici-point { fill: var(--plan-accent); stroke: var(--plan-piece); stroke-width: 0.06; pointer-events: none; }
#plan-svg .cone { pointer-events: none; }
#plan-fond { position: absolute; inset: 0; z-index: 5; background: rgba(18, 22, 30, 0.45); }
#plan-fond[hidden] { display: none; }
#plan-ouvrir {
  position: absolute; z-index: 3;
  top: max(16px, env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 15px 0 12px; border: 0; border-radius: 30px;
  background: var(--plan-papier); color: var(--plan-texte); cursor: pointer;
  font-family: 'Jost', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  box-shadow: 0 8px 20px var(--plan-ombre);
}
#plan-ouvrir[hidden] { display: none; }
#plan-ouvrir svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }

/* Titre, en haut à droite : programme en capitales gravées, pièce et surface, lot et position */
#titre {
  position: absolute;
  top: max(18px, env(safe-area-inset-top, 0px));
  right: max(22px, env(safe-area-inset-right, 0px));
  left: calc(max(16px, env(safe-area-inset-left, 0px)) + 320px);
  text-align: right; pointer-events: none; z-index: 2;
  color: var(--sur-image); text-shadow: 0 1px 8px rgba(10, 12, 16, 0.55);
}
#titre-prog {
  display: block; font-family: 'Cinzel', 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 12px;
  line-height: 1.2; letter-spacing: 0.24em; text-transform: uppercase;
}
#lieu {
  margin: 3px 0 0; font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 500; font-size: 28px; line-height: 1.1; text-wrap: balance;
}
#lieu i { font-size: 0.62em; opacity: 0.85; margin-left: 0.35em; white-space: nowrap; }
#titre-lot {
  margin: 5px 0 0; font-family: 'Jost', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-size: 11.5px; line-height: 1.2;
  letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.88;
}

/* Repères dans l'image */
#reperes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.repere {
  position: absolute; left: 0; top: 0; display: none;
  pointer-events: auto; cursor: pointer; background: transparent; border: 0; padding: 0;
  min-width: 44px; min-height: 44px; touch-action: manipulation;
  color: var(--sur-image); font-family: 'Jost', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Au sol : un anneau posé à plat (aplati selon l'angle sous lequel on voit le sol), un chevron, le nom au survol */
.repere.sol { width: 44px; height: 44px; }
.repere.sol .disque {
  position: absolute; left: 50%; top: 50%; box-sizing: border-box;
  width: var(--d, 36px); height: calc(var(--d, 36px) * var(--r, 0.5));
  transform: translate(-50%, -50%); border-radius: 50%;
  border: 2px solid rgba(251, 248, 241, 0.95);
  background: radial-gradient(ellipse at center, rgba(251, 248, 241, 0.72) 0 22%, rgba(251, 248, 241, 0.16) 24% 100%);
  box-shadow: 0 0 0 1px rgba(18, 22, 30, 0.3), 0 3px 10px rgba(18, 22, 30, 0.35);
  transition: background 0.18s ease, border-color 0.18s ease;
}
.repere.sol .chevron {
  position: absolute; left: 50%; top: calc(50% - var(--d, 36px) * var(--r, 0.5) / 2 - 3px);
  width: max(12px, calc(var(--d, 36px) * 0.34)); height: auto; transform: translate(-50%, -100%);
  fill: none; stroke: rgba(251, 248, 241, 0.95); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 1px 2px rgba(18, 22, 30, 0.6)); animation: respire 2.4s ease-in-out infinite; pointer-events: none;
}
@keyframes respire { 0%, 100% { transform: translate(-50%, -100%); } 50% { transform: translate(-50%, calc(-100% - 4px)); } }
.repere.sol:hover .disque, .repere.sol:focus-visible .disque {
  border-color: #fff; background: radial-gradient(ellipse at center, #fff 0 24%, rgba(138, 59, 44, 0.6) 26% 100%);
}
.repere .info {
  position: absolute; left: 50%; top: calc(50% - var(--d, 36px) * var(--r, 0.5) / 2 - var(--d, 36px) * 0.2 - 12px);
  transform: translate(-50%, -100%); white-space: nowrap; padding: 6px 11px 5px;
  font-size: 12.5px; font-weight: 500; letter-spacing: 0.06em; line-height: 1;
  background: var(--verre-fort); color: var(--sur-image); border: 1px solid rgba(241, 235, 224, 0.35); border-radius: 20px;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
.repere.sol:hover .info, .repere.sol:focus-visible .info { opacity: 1; }
/* Sur une porte : une pastille de verre sombre au nom de la pièce */
.repere.porte {
  display: none; align-items: center; justify-content: center; gap: 8px;
  padding: 0 15px 0 13px; border-radius: 30px; white-space: nowrap;
  background: var(--verre); border: 1px solid rgba(241, 235, 224, 0.55);
  font-size: 14px; font-weight: 500; letter-spacing: 0.05em;
  box-shadow: 0 5px 14px rgba(10, 12, 16, 0.35);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.repere.porte:hover, .repere.porte:focus-visible { background: var(--verre-fort); border-color: #fff; }
.repere.porte svg { width: 13px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.repere.porte svg.fl { width: 14px; height: 11px; opacity: 0.8; }

/* Bulles des prestations : un point sur l'objet, une carte au survol, au toucher ou au clavier */
.repere.bulle { width: 44px; height: 44px; }
.repere.bulle .point {
  position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; box-sizing: border-box;
  transform: translate(-50%, -50%); border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.95); background: rgba(30, 24, 16, 0.4);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
  transition: transform 0.18s ease, background 0.18s ease;
}
.repere.bulle .point::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
.repere.bulle .point::after {
  content: ""; position: absolute; inset: -7px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.75); animation: onde 2.6s ease-out infinite;
}
@keyframes onde { 0% { transform: scale(0.7); opacity: 0.9; } 70%, 100% { transform: scale(1.35); opacity: 0; } }
.repere.bulle:hover .point, .repere.bulle:focus-visible .point, .repere.bulle[aria-expanded="true"] .point {
  transform: translate(-50%, -50%) scale(1.14); background: var(--accent);
}
.repere.bulle:focus-visible { outline: 0; }
.repere.bulle:focus-visible .point { outline: 2px solid #fff; outline-offset: 3px; }
#carte {
  position: absolute; left: 0; top: 0; z-index: 4; box-sizing: border-box;
  width: 264px; max-width: calc(100% - 32px);
  background: var(--carte); color: var(--texte); border-radius: 3px; overflow: hidden;
  box-shadow: 0 22px 48px var(--carte-ombre), 0 2px 6px rgba(0, 0, 0, 0.18);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.2s ease, visibility 0.2s;
}
#carte[data-ouverte="true"] { opacity: 1; visibility: visible; pointer-events: auto; }
#carte img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--barre-fond); }
#carte .txt { padding: 14px 16px 15px; border-top: 2px solid var(--accent); }
#carte .sur { font-size: 10.5px; font-weight: 600; line-height: 1; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); }
#carte h2 {
  margin: 7px 0 6px; font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 600; font-size: 22px; line-height: 1.08; text-wrap: balance;
}
#carte p { margin: 0; font-size: 13.5px; line-height: 1.42; color: var(--texte-doux); }
#carte small {
  display: block; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--bord);

  position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
  bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + 152px);

/* Messages : panorama indisponible, attente */
#avis, #attente {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 4;
  top: calc(max(16px, env(safe-area-inset-top, 0px)) + 92px);

#barre {
  position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + 26px);

}
#barre .vignette {

  transition: opacity 0.18s, box-shadow 0.18s, transform 0.18s;
}

#barre .nom {
  max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

#barre .points button::before { content: ""; width: 6px; height: 6px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(241, 235, 224, 0.75); }

/* Poignée : replie la barre en une ligne (pièce courante et flèches) pour dégager l'image */
#barre-poignee {
  position: absolute; left: 50%; top: -16px; transform: translateX(-50%);

// ============================ Fonctions pures ============================
// Repère du plan : x vers la droite, y vers le jardin (bas du plan), z hauteur.
// Dans three.js : X = x, Y = hauteur, Z = y. Le centre du panorama regarde vers +y du plan (+Z).
const CHAMP_MIN = 50, CHAMP_DEFAUT = 75, CHAMP_MAX = 90;
const PITCH_MAX = (80 * Math.PI) / 180;

// Cap (rad) de A vers B : 0 = regarde vers +y du plan ; positif = tourne vers +x.
const cap = (de, vers) => Math.atan2(vers[0] - de[0], vers[1] - de[1]);

// Projection équirectangulaire d'une direction (dx, dy, dz) du repère de la visionneuse : u, v dans [0, 1], v = 0 en haut.
// Le shader des sphères applique la même formule (t = 1 - v, la texture étant retournée au chargement).
function uvPano(dx, dy, dz) {
  const n = Math.hypot(dx, dy, dz) || 1;
  return {
    u: 0.5 + Math.atan2(-dx / n, dz / n) / (2 * Math.PI),
    v: 0.5 - Math.asin(Math.max(-1, Math.min(1, dy / n))) / Math.PI,
  };
}

// Champ vertical (degrés) pour un champ demandé : en paysage, c'est le champ vertical ;
// en portrait, c'est le champ horizontal, avec un champ vertical plafonné à 100 degrés.
function champVertical(champ, aspect) {
  if (aspect >= 1) return champ;
  const v = (2 * Math.atan(Math.tan((champ * Math.PI) / 360) / aspect) * 180) / Math.PI;
  return Math.min(100, v);
}

// Projection à l'écran d'un point du plan (x, y, z) vu depuis (pos, oeil) avec le cap `yaw`, l'inclinaison `pitch`
// (positive = vers le haut) et un champ vertical `fovV` (degrés). Renvoie { nx, ny, profondeur } avec nx, ny dans
// [-1, 1] à l'écran (nx vers la droite, ny vers le haut), ou null si le point est derrière le regard.
function projeter(pos, oeil, yaw, pitch, fovV, aspect, ancre) {
  const dx = ancre[0] - pos[0], dy = ancre[1] - pos[1], dz = ancre[2] - oeil;
  const avant = dx * Math.sin(yaw) + dy * Math.cos(yaw);       // composante dans la direction du cap
  const droite = -dx * Math.cos(yaw) + dy * Math.sin(yaw);     // composante vers la droite du regard
  const prof = avant * Math.cos(pitch) + dz * Math.sin(pitch);
  const haut = -avant * Math.sin(pitch) + dz * Math.cos(pitch);
  if (prof < 0.15) return null;
  const t = Math.tan((fovV * Math.PI) / 360);
  return { nx: droite / (prof * t * aspect), ny: haut / (prof * t), profondeur: prof, dist: Math.hypot(dx, dy, dz) };
}

function nomCourt(nom) {
  const i = nom.indexOf(', ');
  const s = i >= 0 ? nom.slice(i + 2) : nom;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

        s += `<rect class="plein" x="${r[0]}" y="${r[1]}" width="${w.toFixed(3)}" height="${h.toFixed(3)}" fill="url(#plan-hachure)"/>`;

        s += rect('meuble', r[0], r[1], w, h, '.03') + ligne('detail', [r[0], r[1]], [r[2], r[3]]) + ligne('detail', [r[0], r[3]], [r[2], r[1]]);
      } else if (t === 'wc_suspendu') {
        // réservoir du côté du mur le plus proche, cuvette vers la pièce
        const b = boite[e.piece] || r;
        const cotes = [[r[0] - b[0], 'g'], [b[2] - r[2], 'd'], [r[1] - b[1], 'h'], [b[3] - r[3], 'b']].sort((p, q) => p[0] - q[0])[0][1];
        if (cotes === 'g' || cotes === 'd') {
          const xr = cotes === 'g' ? r[0] : r[2] - 0.18, xc = cotes === 'g' ? r[0] + 0.36 : r[2] - 0.36;
          s += rect('meuble', xr, cy - 0.2, 0.18, 0.4, '.02') + `<ellipse class="meuble" cx="${xc.toFixed(3)}" cy="${cy.toFixed(3)}" rx=".2" ry=".18"/>`;
        } else {
          const yr = cotes === 'h' ? r[1] : r[3] - 0.18, yc = cotes === 'h' ? r[1] + 0.36 : r[3] - 0.36;
          s += rect('meuble', cx - 0.2, yr, 0.4, 0.18, '.02') + `<ellipse class="meuble" cx="${cx.toFixed(3)}" cy="${yc.toFixed(3)}" rx=".18" ry=".2"/>`;
        }
      } else if (t === 'meuble_vasque') {
        s += rect('meuble', r[0], r[1], w, h, '.03') + `<circle class="detail" cx="${cx.toFixed(3)}" cy="${cy.toFixed(3)}" r="${Math.min(0.19, Math.min(w, h) / 2 - 0.05).toFixed(3)}"/>`;
      } else if (t === 'cuisine_bas') {
        s += rect('meuble', r[0], r[1], w, h);
        if (/evier/.test(id)) s += rect('detail', cx - 0.2, cy - 0.17, 0.4, 0.34, '.05');
        if (/cuisson|plaque/.test(id)) for (const dx of [-0.13, 0.13]) for (const dy of [-0.13, 0.13]) s += `<circle class="detail" cx="${(cx + dx).toFixed(3)}" cy="${(cy + dy).toFixed(3)}" r=".075"/>`;
      } else if (t === 'seche_serviette') {
        s += rect('plein-fin', r[0], r[1], w, h);
      } else {
        s += rect('meuble', r[0], r[1], w, h, '.03');
      }
    }
    const obstacles = {};                     // par pièce : ce qu'une étiquette ne doit pas recouvrir
    const gene = (pid, r) => { (obstacles[pid] = obstacles[pid] || []).push(r); };
    for (const e of SCENE.elements || []) if (e.rect) gene(e.piece, [e.rect[0] - 0.08, e.rect[1] - 0.08, e.rect[2] + 0.08, e.rect[3] + 0.08]);
    for (const e of SCENE.mobilier || []) {
      const id = e.id || '';
      if (e.centre) {
        const ray = e.diametre / 2;
        s += `<circle class="meuble" cx="${e.centre[0]}" cy="${e.centre[1]}" r="${ray}"/>`;
        gene(e.piece, [e.centre[0] - ray - 0.08, e.centre[1] - ray - 0.08, e.centre[0] + ray + 0.08, e.centre[1] + ray + 0.08]);
        continue;
      }
      if (!e.rect) continue;
      const r = e.rect, w = r[2] - r[0], h = r[3] - r[1];
      let marge = 0.08;
      s += rect('meuble', r[0], r[1], w, h, '.06');
      if (/^lit/.test(id)) {                  // oreillers du côté du mur le plus proche
        const b = boite[e.piece] || r;
        if (w > h) {
          const xo = Math.abs(r[0] - b[0]) < Math.abs(b[2] - r[2]) ? r[0] + 0.08 : r[2] - 0.5;
          for (let k = 0; k < 2; k++) s += rect('detail', xo, r[1] + 0.13 + k * (h - 0.2) / 2, 0.42, (h - 0.2) / 2 - 0.06, '.06');
        } else {
          const yo = Math.abs(r[1] - b[1]) < Math.abs(b[3] - r[3]) ? r[1] + 0.08 : r[3] - 0.5;
          for (let k = 0; k < 2; k++) s += rect('detail', r[0] + 0.13 + k * (w - 0.2) / 2, yo, (w - 0.2) / 2 - 0.06, 0.42, '.06');
        }
      } else if (/^canape/.test(id)) {
        s += rect('detail', r[0] + 0.07, r[1] + 0.07, w - 0.14, h - 0.14, '.05');
      } else if (/^table/.test(id) && !/basse/.test(id) && Math.max(w, h) >= 1.2 && Math.min(w, h) >= 0.55) {
        const long = Math.max(w, h), n = Math.max(1, Math.floor(long / 0.62));      // chaises le long des deux grands côtés
        for (let k = 0; k < n; k++) {
          const u = (k + 0.5) * long / n;
          if (h >= w) for (const xk of [r[0] - 0.2, r[2] - 0.14]) s += rect('chaise', xk, r[1] + u - 0.19, 0.34, 0.38, '.07');
          else for (const yk of [r[1] - 0.2, r[3] - 0.14]) s += rect('chaise', r[0] + u - 0.19, yk, 0.38, 0.34, '.07');
        }
        marge = 0.3;
      }
      gene(e.piece, [r[0] - marge, r[1] - marge, r[2] + marge, r[3] + marge]);
    }
    for (const pv of SCENE.points_de_vue) gene(pv.piece, [pv.pos[0] - 0.27, pv.pos[1] - 0.27, pv.pos[0] + 0.27, pv.pos[1] + 0.27]);

    // Noms et surfaces (plan agrandi) : dans la plus grande place libre de la pièce, en réduisant le corps au besoin.
    for (const p of SCENE.pieces) {
      const surf = p.surface_plan ? fmt(p.surface_plan) + ' m²' : '';
      const decoupes = [[p.nom]];
      const k = p.nom.search(/[ \-'’]/);
      if (k > 0) decoupes.push([p.nom.slice(0, p.nom[k] === ' ' ? k : k + 1), p.nom.slice(k + 1)]);
      const essais = [];
      for (const corps of [0.36, 0.32, 0.28, 0.25]) for (const lignes of decoupes) essais.push({ corps, lignes, pile: true });
      for (const corps of [0.25, 0.22, 0.2, 0.18]) essais.push({ corps, lignes: [p.nom], pile: false });      // nom et surface sur une ligne
      const b = boite[p.id], genes = obstacles[p.id] || [];
      const pas = (b[2] - b[0]) * (b[3] - b[1]) < 8 ? 0.04 : 0.12;     // petite pièce : recherche plus fine
      let choix = null;
      for (const e of essais) {
        const wn = Math.max(...e.lignes.map((t) => t.length)) * 0.56 * e.corps, ws = surf.length * 0.46 * e.corps;
        const w = e.pile ? Math.max(wn, ws) : wn + (surf ? 0.18 + ws : 0);
        const h = e.pile ? (e.lignes.length + (surf ? 1 : 0)) * e.corps * 1.15 : e.corps * 1.15;
        let mieux = null;
        for (let cy = b[1] + h / 2 + 0.05; cy <= b[3] - h / 2 - 0.05; cy += pas) {
          for (let cx = b[0] + w / 2 + 0.08; cx <= b[2] - w / 2 - 0.08; cx += pas) {
            const r = [cx - w / 2 - 0.05, cy - h / 2 - 0.03, cx + w / 2 + 0.05, cy + h / 2 + 0.03];
            if (![[r[0], r[1]], [r[2], r[1]], [r[2], r[3]], [r[0], r[3]], [cx, r[1]], [cx, r[3]], [r[0], cy], [r[2], cy]].every((q) => dedans(q[0], q[1], p.contour))) continue;
            let libre = Math.min(r[0] - b[0], b[2] - r[2], r[1] - b[1], b[3] - r[3]) + 0.25, pris = false;
            for (const g of genes) {
              if (r[0] < g[2] && r[2] > g[0] && r[1] < g[3] && r[3] > g[1]) { pris = true; break; }
              libre = Math.min(libre, Math.hypot(Math.max(g[0] - r[2], r[0] - g[2], 0), Math.max(g[1] - r[3], r[1] - g[3], 0)));
            }
            if (pris) continue;
            if (!mieux || libre > mieux.libre + 1e-6) mieux = { cx, cy, libre };
          }
        }
        if (mieux) { choix = { e, cx: mieux.cx, cy: mieux.cy, w, h, wn }; break; }
      }
      if (!choix) {                           // aucune place libre : au centre, en petit
        const e = { corps: 0.22, lignes: [p.nom], pile: true };
        choix = { e, cx: centre[p.id][0], cy: centre[p.id][1], w: 0, h: (surf ? 2 : 1) * 0.22 * 1.15, wn: 0 };
      }
      const c = choix.e.corps;
      if (choix.e.pile) {
        let y = choix.cy - choix.h / 2 + c * 0.86;
        for (const t of choix.e.lignes) { s += `<text class="nom" x="${choix.cx.toFixed(2)}" y="${y.toFixed(2)}" font-size="${c}">${esc(t)}</text>`; y += c * 1.15; }
        if (surf) s += `<text class="surface" x="${choix.cx.toFixed(2)}" y="${y.toFixed(2)}" font-size="${(c * 0.95).toFixed(3)}">${esc(surf)}</text>`;
      } else {
        const xg = choix.cx - choix.w / 2, y = choix.cy + c * 0.35;
        s += `<text class="nom" style="text-anchor:start" x="${xg.toFixed(2)}" y="${y.toFixed(2)}" font-size="${c}">${esc(p.nom)}</text>`;
        if (surf) s += `<text class="surface" style="text-anchor:start" x="${(xg + choix.wn + 0.18).toFixed(2)}" y="${y.toFixed(2)}" font-size="${c}">${esc(surf)}</text>`;
      }
    }
    for (const e of SCENE.plan_etiquettes || []) s += `<text class="dehors" x="${e.pos[0]}" y="${e.pos[1]}" font-size="${e.corps || 0.34}">${esc(e.texte)}</text>`;

    for (const pv of SCENE.points_de_vue) s += `<circle class="pv" id="plan-pv-${esc(pv.id)}" cx="${pv.pos[0]}" cy="${pv.pos[1]}" r=".15"/>`;
    s += '<g id="plan-cone-groupe"><path class="cone" d="M0 0 L-1.35 2.25 A2.62 2.62 0 0 0 1.35 2.25 Z" fill="url(#plan-cone-degrade)"/><circle class="ici-halo" r=".34"/><circle class="ici-point" r=".17"/></g>';
    for (const pv of SCENE.points_de_vue) s += `<circle class="pvzone" data-pv="${esc(pv.id)}" cx="${pv.pos[0]}" cy="${pv.pos[1]}" r="0.5"><title>${esc(pv.nom)}</title></circle>`;
    svg.innerHTML = s;
  })();
  const coneGroupe = el('plan-cone-groupe');

  // États du plan : « petit » (carte), « grand » (agrandi, noms et surfaces), « ferme » (pastille). Au téléphone, pas de petit plan.
  const tel = () => window.innerWidth <= 700;
  function etatPlan(e) {
    if (e === 'petit' && tel()) e = 'ferme';
    planEl.setAttribute('data-etat', e);
    svg.setAttribute('viewBox', e === 'grand' ? vbGrand : vbPetit);
    el('plan-ouvrir').hidden = e !== 'ferme';
    el('plan-fond').hidden = e !== 'grand';
    const a = el('plan-agrandir');
    a.setAttribute('aria-label', e === 'grand' ? 'Réduire le plan' : 'Agrandir le plan');
    a.firstElementChild.innerHTML = e === 'grand' ? '<path d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4"/>' : '<path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/>';
  }
  etatPlan('petit');
  el('plan-agrandir').addEventListener('click', () => etatPlan(planEl.getAttribute('data-etat') === 'grand' ? 'petit' : 'grand'));
  el('plan-replier').addEventListener('click', () => etatPlan('ferme'));
  el('plan-ouvrir').addEventListener('click', () => { masquerAide(); etatPlan(tel() ? 'grand' : 'petit'); });
  el('plan-fond').addEventListener('click', () => etatPlan('petit'));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && planEl.getAttribute('data-etat') === 'grand') etatPlan('petit'); });
  window.addEventListener('resize', () => { if (tel() && planEl.getAttribute('data-etat') === 'petit') etatPlan('ferme'); });
  svg.querySelectorAll('.pvzone').forEach((c) => {
    c.addEventListener('click', () => {
      masquerAide();
      if (planEl.getAttribute('data-etat') === 'grand') etatPlan('petit');
      allerPoint(PV[c.getAttribute('data-pv')]);
    });
  });

  // ---- Barre des pièces : une vignette par pièce ; des points pour les positions d'une même pièce ; deux flèches ----
  const ordrePieces = [];
  for (const pv of SCENE.points_de_vue) if (!ordrePieces.includes(pv.piece)) ordrePieces.push(pv.piece);
  const pointsDe = (pid) => SCENE.points_de_vue.filter((p) => p.piece === pid);
  (function construireBarre() {
    const zone = el('barre-pieces');
    for (const pid of ordrePieces) {
      const liste = pointsDe(pid);
      const g = document.createElement('div');
      g.className = 'piece';
      g.id = 'piece-' + pid;
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', nomPiece(pid));
      const v = document.createElement('span');
      v.className = 'vignette';
      v.style.backgroundImage = 'url("vignette_' + encodeURIComponent(pid) + '.jpg")';   // image fournie avec la page
      const n = document.createElement('span');
      n.className = 'nom';
      n.textContent = (PIECE[pid] && PIECE[pid].nom_court) || nomPiece(pid);
      b.append(v, n);
      // Un clic mène à la pièce ; dans la pièce où l'on est déjà, il passe à la position suivante.
      b.addEventListener('click', () => {
        masquerAide();
        if (courant && courant.piece === pid) { if (liste.length > 1) allerPoint(liste[(liste.indexOf(courant) + 1) % liste.length]); }
        else allerPoint(liste[0]);
      });
      const points = document.createElement('span');
      points.className = 'points';
      if (liste.length > 1) {
        for (const pv of liste) {
          const d = document.createElement('button');
          d.type = 'button';
          d.id = 'pv-' + pv.id;
          d.title = nomCourt(pv.nom);
          d.setAttribute('aria-label', pv.nom);
          d.addEventListener('click', () => { masquerAide(); allerPoint(pv); });
          points.appendChild(d);
        }
      }
      g.append(b, points);
      zone.appendChild(g);
    }
    const pas = (d) => {
      if (!courant) return;
      const l = SCENE.points_de_vue;
      masquerAide();
      allerPoint(l[(l.indexOf(courant) + d + l.length) % l.length]);
    };
    el('barre-prec').addEventListener('click', () => pas(-1));
    el('barre-suiv').addEventListener('click', () => pas(1));
    // Barre réductible : la poignée la replie en une ligne. Le choix du visiteur est gardé dans son navigateur, sans que la
    // page en dépende (stockage parfois indisponible).
    const app = el('app'), poignee = el('barre-poignee');
    const reduire = (oui, garder) => {
      app.setAttribute('data-barre', oui ? 'reduite' : 'ouverte');
      poignee.setAttribute('aria-expanded', String(!oui));
      poignee.setAttribute('aria-label', oui ? 'Afficher les pièces' : 'Réduire la barre des pièces');
      if (garder) { try { localStorage.setItem('visite-barre', oui ? 'reduite' : 'ouverte'); } catch (_) { /* sans effet */ } }
    };
    let choix = null;
    try { choix = localStorage.getItem('visite-barre'); } catch (_) { /* sans effet */ }
    reduire(choix === 'reduite', false);
    poignee.addEventListener('click', () => { masquerAide(); reduire(app.getAttribute('data-barre') !== 'reduite', true); window.dispatchEvent(new Event('resize')); });
  })();

  // ---- Outils : plein écran s'il existe ici (il manque sur certains téléphones), aide ----
  (function outils() {
    const racine = el('app'), bp = el('outil-plein');
    if (document.fullscreenEnabled && racine.requestFullscreen) {
      bp.hidden = false;
      bp.addEventListener('click', () => {
        try {
          const p = document.fullscreenElement ? document.exitFullscreen() : racine.requestFullscreen();
          if (p && p.catch) p.catch(() => { bp.hidden = true; });
        } catch (_) { bp.hidden = true; }
      });
    }
    el('outil-aide').addEventListener('click', () => { const a = el('aide'); a.hidden = !a.hidden; });
  })();

  // ---- Rendu three.js : deux sphères de panorama (fondu enchaîné), caméra fixe au centre ----
  const canvas = el('vue');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(CHAMP_DEFAUT, 1, 0.05, 100);
  camera.rotation.order = 'YXZ';

  // Chaque sphère reconstruit la direction du pixel en repère monde, avec un zoom propre ; formule de uvPano() ;
  // couleur écrite telle quelle (le JPEG est déjà en sRGB).
  function creerSphere(transparent, ordre) {
    const uniforms = { uTex: { value: null }, uOpacite: { value: 1 }, uZoom: { value: 1 } };
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(50, 48, 32),
      new THREE.ShaderMaterial({
        uniforms,
        vertexShader: [
          'uniform float uZoom; varying vec3 vDir;',
          'void main() {',
          '  vec4 vp = modelViewMatrix * vec4(position, 1.0);',
          '  vec3 r = vec3(vp.xy / uZoom, vp.z);',
          '  vDir = r * mat3(viewMatrix);',
          '  gl_Position = projectionMatrix * vp;',
          '}',
        ].join('\n'),
        fragmentShader: [
          'uniform sampler2D uTex; uniform float uOpacite; varying vec3 vDir;',
          'void main() {',
          '  vec3 d = normalize(vDir);',
          '  float u = 0.5 + atan(-d.x, d.z) / 6.28318530718;',
          '  float t = 0.5 + asin(clamp(d.y, -1.0, 1.0)) / 3.14159265359;',
          '  gl_FragColor = vec4(texture2D(uTex, vec2(u, t)).rgb, uOpacite);',
          '}',
        ].join('\n'),
        side: THREE.BackSide, transparent, depthTest: false, depthWrite: false,
      })
    );
    mesh.renderOrder = ordre;
    mesh.frustumCulled = false;
    mesh.visible = false;
    scene.add(mesh);
    return { mesh, uniforms };
  }
  const sphereA = creerSphere(false, 0);   // panorama courant
  const sphereB = creerSphere(true, 1);    // panorama d'arrivée, par-dessus pendant le fondu

  // ---- État du regard ----
  const vue = { yaw: 0, pitch: 0, champ: CHAMP_DEFAUT, fovV: CHAMP_DEFAUT, aspect: 1, w: 1, h: 1 };
  let sale = true;                          // un nouveau rendu est nécessaire
  function redimensionner() {
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    renderer.setSize(w, h, false);
    vue.w = w; vue.h = h; vue.aspect = w / h;
    majChamp();
  }
  function majChamp() {
    vue.fovV = champVertical(vue.champ, vue.aspect);
    camera.aspect = vue.aspect;
    camera.fov = vue.fovV;
    camera.updateProjectionMatrix();
    sale = true;
  }
  window.addEventListener('resize', redimensionner);
  redimensionner();

  // ---- Chargement des panoramas ----
  const panos = {};                          // id -> texture
  const promesses = {};                      // id -> Promise<boolean>
  const echecs = {};                         // id -> true
  function chargerPano(id) {
    if (promesses[id]) return promesses[id];
    promesses[id] = new Promise((fini) => {
      let ferme = false;
      const fin = (ok) => { if (!ferme) { ferme = true; if (!ok) echecs[id] = true; fini(ok); } };
      try {
        new THREE.TextureLoader().load(
          'pano_' + id + '.jpg',
          (tex) => {
            tex.generateMipmaps = false;      // évite le trait de couture de l'atan2
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
            panos[id] = tex;
            fin(true);
          },
          undefined,
          () => fin(false)
        );
      } catch (_) { fin(false); }
    });
    return promesses[id];
  }

  // ---- Point de vue courant, repères, plan et listes ----
  let courant = null;
  const zoneReperes = el('reperes');
  const barreEl = el('barre'), appEl = el('app');
  let reperes = [];                          // { el, lien, ancre }

  function majInterface() {
    for (const pv of SCENE.points_de_vue) {
      const d = el('pv-' + pv.id);
      if (d) d.setAttribute('aria-current', String(pv.id === courant.id));
      const m = el('plan-pv-' + pv.id);
      if (m) m.classList.toggle('actuel', pv.id === courant.id);
    }
    for (const p of SCENE.pieces) {
      const g = el('piece-' + p.id);
      if (g) g.classList.toggle('actuelle', p.id === courant.piece);
      const z = el('plan-piece-' + p.id);
      if (z) z.classList.toggle('ici', p.id === courant.piece);
    }
    const lieu = el('lieu');
    lieu.textContent = nomPiece(courant.piece);
    const sp = PIECE[courant.piece] && PIECE[courant.piece].surface_plan;
    if (sp) { const i = document.createElement('i'); i.textContent = fmt(sp) + ' m²'; lieu.appendChild(i); }
    el('titre-lot').textContent = [lotNom, courant.nom.indexOf(', ') >= 0 ? nomCourt(courant.nom) : ''].filter(Boolean).join(' · ');
    // résumé montré quand la barre est réduite : la pièce, et le rang de la position dans la pièce
    const positions = pointsDe(courant.piece);
    el('barre-resume-nom').textContent = (PIECE[courant.piece] && PIECE[courant.piece].nom_court) || nomPiece(courant.piece);
    el('barre-resume-rang').textContent = positions.length > 1 ? (positions.indexOf(courant) + 1) + ' / ' + positions.length : '';
    const g = el('piece-' + courant.piece);
    if (g && g.scrollIntoView) { try { g.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (_) { /* sans effet */ } }
  }

  // ---- Bulles des prestations : une seule carte, posée près du point survolé, touché ou atteint au clavier ----
  const carte = el('carte');
  let carteDe = null;                        // repère dont la carte est ouverte
  let minuteurCarte = null;
  el('carte-image').addEventListener('error', () => { el('carte-image').hidden = true; });
  function ouvrirCarte(r) {
    clearTimeout(minuteurCarte);
    if (carteDe === r) return;
    if (carteDe) carteDe.el.setAttribute('aria-expanded', 'false');
    carteDe = r;
    const b = r.bulle, img = el('carte-image');
    img.hidden = !b.image;
    if (b.image) img.src = b.image;
    el('carte-sur').textContent = b.sur || '';
    el('carte-titre').textContent = b.titre;
    el('carte-texte').textContent = b.texte || '';
    el('carte-note').textContent = b.note || '';
    el('carte-note').hidden = !b.note;
    r.el.setAttribute('aria-expanded', 'true');
    carte.setAttribute('data-ouverte', 'true');
    sale = true;
  }
  function fermerCarte() {
    clearTimeout(minuteurCarte);
    if (!carteDe) return;
    carteDe.el.setAttribute('aria-expanded', 'false');
    carteDe = null;
    carte.setAttribute('data-ouverte', 'false');
  }
  function fermerCarteBientot() {
    clearTimeout(minuteurCarte);
    minuteurCarte = setTimeout(fermerCarte, 220);
  }
  carte.addEventListener('pointerenter', () => clearTimeout(minuteurCarte));
  carte.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') fermerCarteBientot(); });
  // Place la carte à côté de son point, du côté où il reste de la place, sans sortir de l'écran.
  function placerCarte(x, y) {
    const cw = carte.offsetWidth, ch = carte.offsetHeight, m = 16, ecart = 24;
    let gx = x + ecart;
    if (gx + cw > vue.w - m) gx = x - ecart - cw;
    gx = Math.max(m, Math.min(vue.w - m - cw, gx));
    const gy = Math.max(m, Math.min(vue.h - m - ch, y - ch / 2));
    carte.style.transform = `translate(${gx.toFixed(1)}px, ${gy.toFixed(1)}px)`;
  }

  function construireReperes() {
    fermerCarte();
    zoneReperes.textContent = '';
    reperes = [];
    if (!courant) return;
    const vus = new Set();
    for (const l of courant.liens || []) {
      const cible = PV[l.vers];
      if (!cible) continue;
      const cle = l.ancre.join(',');
      if (vus.has(cle)) continue;               // même porte : un seul repère
      vus.add(cle);
      const b = document.createElement('button');
      b.type = 'button';
      if (l.par_porte) {
        b.className = 'repere porte';
        b.innerHTML = '<svg viewBox="0 0 20 24" aria-hidden="true"><path d="M4 22 V3 h12 v19 M2 22 h16"/><circle cx="13" cy="13" r="1"/></svg><span></span>'
          + '<svg class="fl" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 6 h13 M9 1 l5 5 -5 5"/></svg>';
        b.querySelector('span').textContent = nomPiece(cible.piece);
        b.setAttribute('aria-label', 'Aller : ' + nomPiece(cible.piece));
      } else {
        b.className = 'repere sol';
        b.innerHTML = '<span class="disque"></span><svg class="chevron" viewBox="0 0 24 14" aria-hidden="true"><path d="M3 12 L12 3 L21 12"/></svg><span class="info"></span>';
        b.querySelector('.info').textContent = nomCourt(cible.nom);
        b.setAttribute('aria-label', 'Aller : ' + cible.nom);
      }
      b.addEventListener('click', () => { masquerAide(); allerPoint(cible); });
      zoneReperes.appendChild(b);
      reperes.push({ el: b, ancre: l.ancre, porte: !!l.par_porte });
    }
    for (const bulle of SCENE.points_interet || []) {
      const ancre = bulle.ancres && bulle.ancres[courant.id];
      if (!ancre) continue;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'repere bulle';
      b.setAttribute('aria-label', bulle.titre + ' : ' + (bulle.texte || ''));
      b.setAttribute('aria-expanded', 'false');
      const pt = document.createElement('span'); pt.className = 'point';
      b.appendChild(pt);
      const r = { el: b, ancre, bulle };
      b.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') ouvrirCarte(r); });
      b.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') fermerCarteBientot(); });
      b.addEventListener('focus', () => ouvrirCarte(r));
      b.addEventListener('blur', fermerCarteBientot);
      b.addEventListener('click', (e) => {
        masquerAide();
        if (carteDe === r && e.detail && !b.matches(':hover')) fermerCarte(); else ouvrirCarte(r);
      });
      zoneReperes.appendChild(b);
      reperes.push(r);
      // la photo est demandée un peu plus tard, pour ne pas ralentir le chargement des panoramas, et reste prête avant le survol
      if (bulle.image) setTimeout(() => { const pre = new Image(); pre.src = bulle.image; }, 1500);
    }
    sale = true;
  }

  function placerReperes() {
    if (!courant) return;
    const sansRepere = !!trans;
    // Un repère qui tombe sous la barre des pièces n'est pas montré : il dépasserait dessous sans pouvoir être touché.
    // Barre réduite, il reparaît.
    const zb = barreEl.getBoundingClientRect(), za = appEl.getBoundingClientRect();
    const bx0 = zb.left - za.left - 8, bx1 = zb.right - za.left + 8, by0 = zb.top - za.top - 8;
    for (const r of reperes) {
      const p = sansRepere ? null : projeter(courant.pos, courant.oeil, vue.yaw, vue.pitch, vue.fovV, vue.aspect, r.ancre);
      const hors = !p || Math.abs(p.nx) > (r.bulle ? 1.02 : 1.15) || Math.abs(p.ny) > (r.bulle ? 1.02 : 1.15);
      const x = hors ? 0 : (p.nx * 0.5 + 0.5) * vue.w, y = hors ? 0 : (0.5 - p.ny * 0.5) * vue.h;
      if (hors || (y > by0 && x > bx0 && x < bx1)) { r.el.style.display = 'none'; if (carteDe === r) fermerCarte(); continue; }
      if (r.bulle) {
        if (carteDe === r) placerCarte(x, y);
      } else if (!r.porte) {
        // anneau de 0,84 m de diamètre : taille apparente à l'écran, zone tactile de 44 px au moins
        const px = Math.max(22, Math.min(64, (0.84 / p.profondeur) * (vue.h / 2) / Math.tan((vue.fovV * Math.PI) / 360)));
        const boite = Math.max(44, px);
        r.el.style.width = boite + 'px';
        r.el.style.height = boite + 'px';
        r.el.style.setProperty('--d', px + 'px');
        // aplatissement de l'anneau : sinus de l'angle sous lequel on voit le sol à cet endroit
        const incl = Math.atan2(courant.oeil - r.ancre[2], Math.hypot(r.ancre[0] - courant.pos[0], r.ancre[1] - courant.pos[1]));
        r.el.style.setProperty('--r', Math.max(0.22, Math.min(0.8, Math.sin(incl))).toFixed(3));
      }
      r.el.style.display = r.porte ? 'flex' : 'block';
      r.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%)`;
    }
  }

  // ---- Transition entre deux points de vue : fondu enchaîné avec légère avancée du champ ----
  let trans = null;
  let numeroDemande = 0;
  const cheminCourt = (de, a) => ((((a - de + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;

  function finTransition() {
    if (!trans) return;
    sphereA.uniforms.uTex.value = sphereB.uniforms.uTex.value;
    sphereA.uniforms.uZoom.value = 1;
    sphereB.mesh.visible = false;
    sphereB.uniforms.uOpacite.value = 0;
    sphereB.uniforms.uZoom.value = 1;
    vue.yaw = trans.yaw0 + trans.dyaw;
    trans = null;
    construireReperes();
    sale = true;
  }
  function demarrerTransition(pv, porte) {
    finTransition();
    sphereB.uniforms.uTex.value = panos[pv.id];
    sphereB.uniforms.uOpacite.value = 0;
    sphereB.uniforms.uZoom.value = 0.9;
    sphereB.mesh.visible = true;
    const yawCible = porte ? cap(pv.pos, pv.regarde) : vue.yaw;
    courant = pv;
    majInterface();
    trans = { t0: performance.now(), dur: reduit ? 0 : 620, yaw0: vue.yaw, dyaw: porte ? cheminCourt(vue.yaw, yawCible) : 0 };
    fermerCarte();
    zoneReperes.textContent = '';
    reperes = [];
    sale = true;
    if (reduit) finTransition();
  }
  function avancerTransition(now) {
    if (!trans) return;
    const k = Math.min(1, (now - trans.t0) / trans.dur);
    const s = k * k * (3 - 2 * k);
    vue.yaw = trans.yaw0 + trans.dyaw * s;
    sphereA.uniforms.uZoom.value = 1 + 0.16 * s;
    sphereB.uniforms.uOpacite.value = s;
    sphereB.uniforms.uZoom.value = 0.9 + 0.1 * s;
    sale = true;
    if (k >= 1) finTransition();
  }

  // Aller à un point de vue (liste, plan, repère). Garde le cap, sauf en franchissant une porte.
  function allerPoint(pv) {
    if (!pv || !courant || (pv.id === courant.id && !trans)) return;
    const numero = ++numeroDemande;
    const lien = (courant.liens || []).find((l) => l.vers === pv.id);
    const porte = lien ? !!lien.par_porte : pv.piece !== courant.piece;
    if (echecs[pv.id]) { avis('Le panorama « ' + pv.nom + ' » est indisponible. Les autres points de vue restent accessibles.'); return; }
    const attente = !panos[pv.id];
    let minuteur = null;
    if (attente) minuteur = setTimeout(() => { el('attente').hidden = false; }, 250);
    chargerPano(pv.id).then((ok) => {
      clearTimeout(minuteur);
      el('attente').hidden = true;
      if (numero !== numeroDemande) return;     // une demande plus récente a pris le relais
      if (!ok) { avis('Le panorama « ' + pv.nom + ' » n\'a pas pu être chargé. Les autres points de vue restent accessibles.'); return; }
      demarrerTransition(pv, porte);
    });
  }

  // ---- Regarder : glisser (souris, doigt), molette et pincement ----
  const pointeurs = new Map();
  let pince = null;                          // distance initiale et champ initial
  canvas.addEventListener('pointerdown', (e) => {
    fermerCarte();
    pointeurs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* sans effet */ }
    if (pointeurs.size === 2) {
      const [a, b] = [...pointeurs.values()];
      pince = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, champ: vue.champ };
    }
    canvas.classList.add('glisse');
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointeurs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointeurs.size >= 2 && pince) {
      const [a, b] = [...pointeurs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      vue.champ = Math.max(CHAMP_MIN, Math.min(CHAMP_MAX, pince.champ * (pince.d / d)));
      majChamp();
      masquerAide();
      return;
    }
    if (Math.abs(dx) + Math.abs(dy) < 0.5) return;
    masquerAide();
    // Sensibilité plafonnée : 0,005 rad par pixel au plus, 2,6 rad sur toute la largeur d'un grand écran.
    const k = Math.min(0.005, 2.6 / Math.max(1, vue.w)) * (vue.champ / CHAMP_DEFAUT);
    if (trans) finTransition();
    vue.yaw += dx * k;                       // glisser à droite : la vue tourne à gauche
    vue.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, vue.pitch + dy * k));
    sale = true;
  });
  function finGeste(e) {
    pointeurs.delete(e.pointerId);
    if (pointeurs.size < 2) pince = null;
    if (!pointeurs.size) canvas.classList.remove('glisse');
  }
  canvas.addEventListener('pointerup', finGeste);
  canvas.addEventListener('pointercancel', finGeste);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    masquerAide();
    vue.champ = Math.max(CHAMP_MIN, Math.min(CHAMP_MAX, vue.champ + Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 100) * 0.04));
    majChamp();
  }, { passive: false });

  // ---- Boucle d'affichage : rendu seulement quand quelque chose a changé ----
  function boucle(now) {
    avancerTransition(now);
    if (sale) {
      sale = false;
      camera.rotation.set(vue.pitch, vue.yaw + Math.PI, 0);
      camera.updateMatrixWorld(true);
      sphereA.mesh.visible = !!sphereA.uniforms.uTex.value;
      renderer.render(scene, camera);
      placerReperes();
      coneGroupe.setAttribute('transform', `translate(${courant.pos[0]} ${courant.pos[1]}) rotate(${(-vue.yaw * 180) / Math.PI})`);
    }
    requestAnimationFrame(boucle);
  }

  // ---- Ouverture : point de départ, puis chargement des autres panoramas en arrière-plan ----
  const depart = PV[SCENE.depart] || SCENE.points_de_vue[0];
  (async function ouvrir() {
    const ordre = [depart, ...SCENE.points_de_vue.filter((p) => p !== depart)];
    let ouvert = null;
    for (const pv of ordre) {
      if (await chargerPano(pv.id)) { ouvert = pv; break; }
    }
    if (!ouvert) {
      erreurFatale("Aucun panorama n'a pu être chargé. Vérifiez la connexion, puis rechargez la page.");
      return;
    }
    courant = ouvert;
    vue.yaw = cap(ouvert.pos, ouvert.regarde);
    vue.pitch = 0;
    sphereA.uniforms.uTex.value = panos[ouvert.id];
    majInterface();
    construireReperes();
    sale = true;
    el('chargement').hidden = true;
    if (ouvert !== depart) avis('Le panorama « ' + depart.nom + ' » est indisponible : la visite s\'ouvre sur un autre point de vue.');
    requestAnimationFrame(boucle);
    // Les liens du point courant d'abord, puis les autres, un par un.
    const lies = (ouvert.liens || []).map((l) => PV[l.vers]).filter(Boolean);
    const suite = [...lies, ...SCENE.points_de_vue.filter((p) => !lies.includes(p))];
    for (const pv of suite) await chargerPano(pv.id);
  })();
})();
</script>
